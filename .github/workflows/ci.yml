name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck · tests · build · browser specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (tsc -b, strict)
        run: npm run typecheck

      - name: Unit, regression, property and no-key tests (Vitest)
        run: npm test

      - name: Production build (the command Vercel runs)
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # /api/detect and the device voice are stubbed in every spec: no API key, no AI provider call.
      - name: Browser specs on vite preview
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
